[project]
name = "hereford-voca"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "boto3>=1.43.126",
    "django==6.1.2",
    "djangorestframework==3.18.3",
    "djangorestframework-simplejwt==5.5.1",
    "pillow>=13.0.0",
    "psycopg[binary]==3.3.6",
    "python-dotenv==1.2.4",
    "redis>=8.1.0",
    "uvicorn==0.54.0",
    "whitenoise>=6.12.0",
]

[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = ["hereford/*/migrations"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"hereford/hereford/settings_*.py" = ["F403"]
"hereford/*/tests.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["accesos", "cuestionario", "hereford"]

[tool.ruff.format]
line-ending = "lf"
